<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="acertarPalavra()">Acertar</button>
</body>
</html>
<script>
    function acertarPalavra(){
        let valor = ""
        let palavra =  "1234"
        let contador = 0
        

        while(valor != palavra && contador < 10){
            valor = prompt("Insira a palavra secreta")
            contador++
        }
    }
</script>
