<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex6</title>
</head>
<body>
    Digite a sua nota:
    <input type="text" id="ipt_nota"> <br>

    Digite sua frequência:
    <input type="text" id="ipt_freq"> <br>

    <button onclick="avaliar()">Avaliar aluno</button>
</body>
</html>
<script>
    function avaliar() {
        let nota = Number(ipt_nota.value)
        let freq = Number(ipt_freq.value)

        if (nota >= 6 && freq >= 75) {
            alert(`Parabéns! Aprovado!`)
        } else {
            alert(`Infelizmente, não foi desta vez`)
        }
    }
</script>
