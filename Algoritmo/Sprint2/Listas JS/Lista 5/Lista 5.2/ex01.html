<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex1</title>
</head>
<body>
    Digite a nota para o atendimento:
    <input type="text" id="ipt_nota"> <br>

    <button onclick="avaliar()">Avaliar atendimento</button>
    
    <div id="exibir"></div>
</body>
</html>
<script>
    function avaliar() {
        let nota = Number(ipt_nota.value)

        if (nota >= 0 && nota < 5) {
            exibir.innerHTML = `Não aprovado`
        } else if (nota >= 5 && nota <= 6) {
            exibir.innerHTML = `Neutro`
        } else if (nota > 6 && nota <= 10) {
            exibir.innerHTML = `Aprovado`
        } else {
            exibir.innerHTML = `Nota inválida`
        }
    }
</script>
