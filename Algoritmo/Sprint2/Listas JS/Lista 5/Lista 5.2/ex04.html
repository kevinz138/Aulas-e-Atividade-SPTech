<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex4</title>
</head>
<body>
    Digite o login:
    <input type="text" id="ipt_login"> <br>
    Digite a senha:
    <input type="text" id="ipt_senha"> <br>
    Digite informação pessoal:
    <input type="text" id="ipt_infoPessoal"> <br>

    <button onclick="analisar()">Autenticar</button>

    <div id="exibir"></div>
</body>
</html>
<script>
    function analisar() {
        let login = ipt_login.value
        let senha = ipt_senha.value
        let infoPessoal = ipt_infoPessoal.value

        if (login == `ana` && senha == `braga` && (infoPessoal == `1949` || infoPessoal == `louro josé`)) {
            exibir.innerHTML = `Usuário autenticado`
        } else {
            exibir.innerHTML = `Falha na autenticação`
        }
    }
</script>
