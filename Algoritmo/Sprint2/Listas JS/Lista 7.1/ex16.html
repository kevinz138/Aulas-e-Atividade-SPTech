<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex16</title>
</head>
<body>
    Quantos dias você faz musculação:
    <input type="text" id="ipt_dias"> <br>

    <button onclick="exibir()">Exibir rotina mensal!</button>

    <div id="div_exibir"></div>
</body>
</html>
<script>
    function exibir() {
        let contador = 1
        let dias = Number(ipt_dias.value)
        let msg = ``

        while (contador < 30) {
            if ((contador -1) % dias == 0) {
                msg += `Dia ${contador} - Musculação <br>`
            } else {
                msg += `Dia ${contador} - Comer, dormir etc <br>`
            }
            contador++
        }

        div_exibir.innerHTML = msg
    }
</script>
