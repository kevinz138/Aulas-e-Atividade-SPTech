<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex5</title>
</head>

<body>
    Digite os nomes dos filmes que mais gosta:
    <input type="text" id="ipt_filme"> <br>

    <button onclick="cadastrar()">Cadastrar Filme</button>

    <div id="exibir"></div>
</body>

</html>
<script>
    let lista = []

    function cadastrar() {
        let filme = ipt_filme.value
        lista.push(filme)
        console.log(lista)

        if (lista.length >= 3) {
            exibir.innerHTML = `
            Seu filme favorito: ${lista[0]} <br>
            Seu 3° filme favorito: ${lista[2]} <br>
            Total de filmes cadastrados: ${lista.length}`
        } else {
            exibir.innerHTML = `
            Seu filme favorito: ${lista[0]} <br>
            Seu 3° filme favorito: Ainda não existe <br>
            Total de filmes cadastrados: ${lista.length}`
        }
    }
</script>
