<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex3</title>
</head>
<body>
    <button onclick="analisar()">Digite uma frase</button>
    <div id="exibir"></div>
</body>
</html>
<script>
    function analisar() {
        let valor = prompt(`Digite uma frase`)
        
        for (let i = 1; i <= 7; i++){
            exibir.innerHTML += `${i}° ${valor} <br>`
        }
    }
</script>
