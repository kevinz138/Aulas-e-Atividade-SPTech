<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex1</title>
</head>
<body>
    <button onclick="contar()">Contar</button>
    <div id="exibir"></div>
</body>
</html>
<script>
    function contar() {
        for (let i = 1; i <= 15; i++) [
            exibir.innerHTML += `${i} <br>`
        ]
    }
</script>
