<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex7</title>
</head>
<body>
    <button onclick="contar()">S2 Pares</button>
    <div id="exibir"></div>
</body>
</html>
<script>
    function contar() {
        for (let i = 1; i <= 100; i += 2) {
            exibir.innerHTML += `${i}<br>`
        }
    }
</script>
