<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex5</title>
</head>
<body>
    Digite uma senha:
    <input oninput="trocar()" type="text" id="ipt_senha"> <br>
    <div id="exibir"></div>
</body>
</html>
<script>
    function trocar() {
        let senha = ipt_senha.value
        let formatado = senha.replaceAll('a', '@').replaceAll('A', '@').replaceAll('e', '3').replaceAll('E', '3')

        exibir.innerHTML = formatado
    }
</script>
