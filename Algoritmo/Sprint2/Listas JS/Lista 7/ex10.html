<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex10</title>
</head>
<body>
    Digite um intervalo incial:
    <input type="text" id="ipt_intervaloInicio"> <br>
    Digite um intervalo final:
    <input type="text" id="ipt_intervaloFinal"> <br>

    <button onclick="pares()">S2 Pares</button>

    <div id="exibir"></div>
</body>
</html>
<script>
    function pares() {
        let contador = Number(ipt_intervaloInicio.value)
        let final = Number(ipt_intervaloFinal.value)

        while (contador < final) {
            if (contador % 2 == 0) {
                exibir.innerHTML += `${contador} <br>`
            }
            contador++
        }
    }
</script>
