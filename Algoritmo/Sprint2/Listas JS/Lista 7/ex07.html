<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex7</title>
</head>
<body>
    <button onclick="contar()">S2 Pares</button>
    <div id="exibir"></div>
</body>
</html>
<script>
    let contador = 0
    function contar() {
        while (contador <= 100) {
            exibir.innerHTML += `${contador}<br>`
            contador += 2
        }
    }
</script>
