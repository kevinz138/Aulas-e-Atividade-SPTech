<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex4</title>
</head>
<body>
    Digite o nome do aluno:
    <input type="text" id="ipt_aluno"> <br>

    <button onclick="cadastrar()">Cadastrar</button>

    <div id="exibir"></div>
</body>
</html>
<script>
    let nomes = []
    
    function cadastrar() {
        let aluno = ipt_aluno.value

        nomes.push(aluno)
        exibir.innerHTML = ``

        for (let i = nomes.length - 1; i >= 0; i--) {
            exibir.innerHTML += `${nomes[i]} <br>`
        }
    }
</script>
