<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex3</title>
</head>
<body>
    Digite o primeiro número de 1 a 10:
    <input type="text" id="ipt_primeiroNum"> <br>
    Digite o segundo número de 30 a 100:
    <input type="text" id="ipt_segundoNum"> <br>

    <button onclick="mostrar()">Ver Pares</button>

    <div id="exibir"></div>
</body>
</html>
<script>
    function mostrar() {
        let num1 = Number(ipt_primeiroNum.value)
        let num2 = Number(ipt_segundoNum.value)
        let msg = ``

        if (num1 < 1 || num1 > 10) {
            alert(`O primeiro número tem que estar entre 1 e 10`)
        } else if (num2 < 30 || num2 > 100) {
            alert(`O segundo número tem que estar entre 30 e 100`)
        } else {
            for (i = num1; i <= num2; i++) {
                if (i % 2 == 0) {
                    msg += `${i} <br>`
                }
            }
            exibir.innerHTML = msg
        }
    }
</script>
