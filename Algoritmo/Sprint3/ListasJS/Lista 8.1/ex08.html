<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex8</title>
</head>
<body>
    Digite um numero entre 20 e 100:
    <input type="text" id="ipt_numero"> <br>

    <button onclick="multiplo()">Adoro múltiplos de 5</button>

    <div id="exibir"></div>
</body>
</html>
<script>
    function multiplo() {
        let numero = Number(ipt_numero.value)

        if (numero >= 20 && numero <= 100) {
            for (let i = numero; i <= 100; i += 5) {
                exibir.innerHTML += `${i} <br>`
            }
        } else {
            alert(`Digite um número permitido`)
        }
    }
</script>
