<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex3</title>
</head>
<body>
    Nome do produto:
    <input type="text" id="ipt_nome"> <br>
    Quantidade em estoque:
    <input type="text" id="ipt_qtdEstoque"> <br>
    Preço:
    <input type="text" id="ipt_preco"> <br>

    <button onclick="cadastrar()">Cdastrar Produto</button>

    <div id="exibir"></div>
</body>
</html>
<script>
    function cadastrar() {
        let msg = ``
        let produto = {
            nome: ipt_nome.value,
            qtdEstoque: Number(ipt_qtdEstoque.value),
            preco: Number(ipt_preco.value)
        }
        
        produto.valorTotal = (produto.qtdEstoque + 10) * produto.preco

        msg += `Produto: ${produto.nome} <br>
                Quantidade Atualizada: ${produto.qtdEstoque + 10} <br>
                Preço Unitário: R$${produto.preco} <br>
                Valor Total: R$${produto.valorTotal} <br>`

        exibir.innerHTML = msg
    }
</script>
