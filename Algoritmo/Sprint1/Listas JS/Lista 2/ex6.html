<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex6</title>
</head>
<body>
    <span>Digite a quantidade de B-Dollars que gostaria de converter: </span>
    <input placeholder="Ex 50" type="text" id="ipt_bdoll"> <br>
    <span>Digite quanto vale 1 B-Dollar em real: </span>
    <input placeholder="Ex 5" type="text" id="ipt_convert"> <br>
    
    <button onclick="calcula()">Calcular Câmbio</button>

    <div id="exibir">
        
    </div>
</body>
</html>
<script>
    function calcula() {
        let soma = (Number(ipt_bdoll.value) * Number(ipt_convert.value)) - 5.50;
        let result = `Ao converter seus B-Dollars, o dinheiro disponível será: R$${soma}`;

        exibir.innerHTML = result;
    }
</script>
