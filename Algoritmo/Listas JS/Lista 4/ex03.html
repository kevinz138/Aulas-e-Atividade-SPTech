<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex3</title>
</head>

<body>
    <span>Digite a primeira nota: </span>
    <input type="text" id="ipt_primNota"> <br>
    <span>Digite a segunda nota: </span>
    <input type="text" id="ipt_segNota"> <br>
    <span>Digite a terceira nota: </span>
    <input type="text" id="ipt_tercNota"> <br>

    <button onclick="calcular()">Analisar desempenho</button>

    <div id="exibir">

    </div>
</body>

</html>
<script>
    function calcular() {
        let nota1 = Number(ipt_primNota.value);
        let nota2 = Number(ipt_segNota.value);
        let nota3 = Number(ipt_tercNota.value);

        let media = (nota1 + nota2 + nota3) / 3;

        let msg = `Sua média foi de ${media.toFixed(2)}`;
        let msg2 = `Sua média foi de ${media.toFixed(2)} <br> Parabéns, você é fora de série!`;
        
        if (media < 9.4) {
            exibir.innerHTML = msg;
        } else {
            exibir.innerHTML = msg2;
        }
    }
</script>
