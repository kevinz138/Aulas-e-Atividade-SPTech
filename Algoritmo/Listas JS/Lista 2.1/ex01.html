<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex1</title>
</head>
<body>
    <span>Digite o primeiro número: </span>
    <input type="text" id="ipt_num1"> <br>
    <span>Digite o primeiro número: </span>
    <input type="text" id="ipt_num2"> <br>

    <button onclick="soma()">Soma</button>
    <button onclick="sub()">Subtrair</button>
    <button onclick="mult()">Multiplicação</button>
    <button onclick="dividir()">Divisão</button>

    <div id="exibir">

    </div>
</body>
</html>
<script>
    function soma() {
        let n1 = Number(ipt_num1.value);
        let n2 = Number(ipt_num2.value);
        let conta = n1 + n2;
        let result = `A soma entre ${n1} e ${n2} é ${conta}`;

        exibir.innerHTML = result;
    }

    function sub() {
        let n1 = Number(ipt_num1.value);
        let n2 = Number(ipt_num2.value);
        let conta = n1 - n2;
        let result = `A diferença entre ${n1} e ${n2} é ${conta}`;

        exibir.innerHTML = result;
    }

    function mult() {
        let n1 = Number(ipt_num1.value);
        let n2 = Number(ipt_num2.value);
        let conta = n1 * n2;
        let result = `O produto entre ${n1} e ${n2} é ${conta}`;

        exibir.innerHTML = result;
    }

    function dividir() {
        let n1 = Number(ipt_num1.value);
        let n2 = Number(ipt_num2.value);
        let conta = n1 / n2;
        let result = `A razão entre ${n1} e ${n2} é ${conta}`;

        exibir.innerHTML = result;
    }
</script>
