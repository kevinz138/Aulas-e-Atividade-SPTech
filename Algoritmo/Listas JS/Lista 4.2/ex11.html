<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex11</title>
</head>
<body>
    <span>Digite a porcentagem de umidade no ambiente: </span>
    <input type="text" id="ipt_umidade"> <br>
    
    <button onclick="verificar()">Verificar umidade</button>

    <div id="exibir"></div>
</body>
</html>
<script>
    function verificar() {
        let umi = Number(ipt_umidade.value)
        if (umi < 12) {
            exibir.innerHTML = `Estado de Emergencia`
        } else if (umi <= 20) {
            exibir.innerHTML = `Estado de alerta`
        } else if (umi <= 30) {
            exibir.innerHTML = `Estado de atenção`
        } else {
            exibir.innerHTML = `Nenhum risco`
        }
    }
</script>
