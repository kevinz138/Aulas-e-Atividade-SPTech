<body>

        } else {
            exibir.innerHTML = `<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQwi-JBHwK09u3wyN5SFtbUC36ufKz91N3n26C-Uru2DxuxWMeTa8dptzWH&s=10" alt="">`
        }
    }
</script>
