<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex14</title>
</head>
<body>
    <span>Digite a primeira nota: </span>
    <input type="text" id="ipt_priNota"> <br>
    <span>Digite a segunda nota: </span>
    <input type="text" id="ipt_segNota"> <br>

    <button onclick="verifica()">Verificar situação</button>
</body>
</html>
<script>
    function verifica() {
        let nota1 = Number(ipt_priNota.value);
        let nota2 = Number(ipt_segNota.value);

        let media = (nota1 + nota2) / 2;

        if (media >= 6) {
            alert("Parabéns, aprovado!");
        } else {
            alert("Tente outra vez...");
        }
    }
</script>
