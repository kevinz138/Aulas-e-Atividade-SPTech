<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex11</title>
</head>
<body>
    <span>Digite seu nome: </span>
    <input type="text" id="ipt_nome"> <br>
    <span>Digite sua idade: </span>
    <input type="" id="ipt_idade"> <br>

    <button onclick="avaliar()">Avaliar aluno</button>

    <div id="exibir">

    </div>
</body>
</html>
<script>
    function avaliar() {
        let nome = ipt_nome.value;
        let idade = Number(ipt_idade.value);

        if (idade >= 18) {
            exibir.innerHTML = `${nome}, vamos tirar a CNH?`;
        } else {
            exibir.innerHTML = `${nome}, vai jogar PlayStation!`;
        }
    }
</script>
