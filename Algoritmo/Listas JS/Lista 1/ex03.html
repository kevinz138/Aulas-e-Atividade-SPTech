<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex3</title>
</head>
<body>
    <span>Nome do time: </span>
    <input type="text" id="ipt_time"> <br>

    <span>Quantidade de titulo: </span>
    <input type="number" id="ipt_titulo"> <br>

    <button onclick="time()">Amo meu time</button>
</body>
</html>
<script>
    function time() {
        alert('O time '+ipt_time.value+' tem '+ipt_titulo.value+' títulos');
    }
</script>
